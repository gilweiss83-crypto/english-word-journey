<script>
(() => {
  'use strict';
  const topics = [
    {
      id:'wind', icon:'🌬️', tab:'רוח', title:'חשמל מרוח', gif:'./assets/wind-to-electricity.gif',
      idea:'הרוח כבר נמצאת בתנועה. היא מסובבת את להבי הטורבינה, והטורבינה מניעה את המחולל.',
      chain:['רוח','אנרגיית תנועה','סיבוב טורבינה','מחולל','אנרגיה חשמלית'],
      remember:'הטורבינה מסתובבת; המחולל הוא החלק שממיר את התנועה לחשמל.',

      labLabel:'עוצמת הרוח', labIcon:'🌬️'

    {

      labLabel:'עוצמת זרם המים', labIcon:'💦'
    },
    {
      id:'steam', icon:'♨️', tab:'קיטור', title:'תחנה תרמית עם קיטור', gif:'./assets/steam-to-electricity.gif',

  const buildTasks = topics.map(t => ({
    topic:t.id,title:t.title,gif:t.gif,answer:t.chain.map(x => x.replace(' — אנרגיה כימית','')),

  function answerQuiz(i){if(state.quizSelected!==null)return;state.quizSelected=i;const q=state.quiz[state.quizIndex],ok=i===q.a;if(ok)state.score+=10;else state.missed.push(q);play(ok);document.querySelectorAll('.quiz-choice').forEach((b,idx)=>{b.disabled=true;if(idx===q.a)b.classList.add('correct');else if(idx===i)b.classList.add('wrong')});document.getElementById('quizFeedback').innerHTML='<div class="feedback '+(ok?'':'bad')+'"><b>'+(ok?'בדיוק!':'כמעט — הנה החיבור:')+'</b> '+esc(q.why)+'</div><div class="next-row"><button class="primary small" type="button" data-action="quiz-next">'+(state.quizIndex===state.quiz.length-1?'לתוצאות':'לשאלה הבאה')+'</button></div>'}
  function quizNext(){state.quizIndex++;state.quizSelected=null;if(state.quizIndex>=state.quiz.length)renderResult();else renderQuiz()}
  function renderResult(){state.mode='result';const correct=state.quiz.length-state.missed.length;if(!state.review&&state.score>best){best=state.score;try{localStorage.setItem('energyControlBest',String(best))}catch(_){}}const strong=state.missed.length<=2;const body='<div class="panel result"><img src="./energy-crew.webp" alt="צוות האנרגיה חוגג את סיום המשחק"><div class="stage-kicker">המשימה הושלמה</div><h2>'+(strong?'כל הכבוד, חדר הבקרה בידיים שלכם!':'עבודה טובה — עכשיו יודעים בדיוק מה לחזק')+'</h2><p>במבחן עניתם נכון על '+correct+' מתוך '+state.quiz.length+' שאלות.</p><div class="result-score">'+state.score+' <small>נקודות</small></div><div class="result-actions">'+(state.missed.length?'<button class="secondary" type="button" data-action="review">תרגול '+state.missed.length+' טעויות</button>':'')+'<button class="primary small" type="button" data-action="restart">משחק חדש</button></div><div class="summary"><b>משפט שכדאי לדעת להסביר במילים:</b><br>רוח, מים, קיטור או גזי שרפה מעבירים אנרגיית תנועה לטורבינה. הטורבינה מסתובבת ומניעה מחולל, והמחולל ממיר את התנועה לאנרגיה חשמלית.'+(best?' השיא שנשמר במכשיר: '+best+' נקודות.':'')+'</div></div>';screen.innerHTML=shell(4,'סיימתם את כל התחנות','דו״ח מסכם','cat2',body)}

  soundBtn.addEventListener('click',()=>{state.sound=!state.sound;soundBtn.textContent=state.sound?'♪ צליל: פועל':'♪ צליל: כבוי';soundBtn.setAttribute('aria-pressed',String(state.sound));if(state.sound)play(true)});
  homeBtn.addEventListener('click',intro);
  screen.addEventListener('input',e=>{if(e.target.id==='powerRange'){state.labValue=Number(e.target.value);renderLab()}});
  screen.addEventListener('click',e=>{
    const action=e.target.closest('[data-action]')?.dataset.action;
    const topicBtn=e.target.closest('[data-topic]');if(topicBtn){state.topic=topicBtn.dataset.topic;renderLearn();return}
    const labTopic=e.target.closest('[data-lab-topic]');if(labTopic){state.labTopic=labTopic.dataset.labTopic;renderLab();return}
    const labAnswer=e.target.closest('[data-lab-answer]');if(labAnswer&&!state.labAnswered){const ok=Number(labAnswer.dataset.labAnswer)===1;labAnswer.classList.add(ok?'correct':'wrong');play(ok);if(ok){state.labAnswered=true;state.score+=10;setTimeout(renderLab,420)}else{document.getElementById('labFeedback').innerHTML='<div class="feedback bad">נסו לחשוב: פחות תנועה נכנסת למערכת — האם הטורבינה יכולה להסתובב מהר יותר?</div>'}return}
    const piece=e.target.closest('[data-piece]');if(piece){const i=Number(piece.dataset.piece);state.buildPlaced.push(state.buildPool.splice(i,1)[0]);renderBuild();return}
    const unplace=e.target.closest('[data-unplace]');if(unplace){const i=Number(unplace.dataset.unplace);state.buildPool.push(state.buildPlaced.splice(i,1)[0]);renderBuild();return}
    const quizAnswer=e.target.closest('[data-quiz-answer]');if(quizAnswer){answerQuiz(Number(quizAnswer.dataset.quizAnswer));return}
    if(action==='start'){state.score=0;state.visited=new Set(['wind']);state.topic='wind';state.labAnswered=false;state.labValue=35;renderLearn()}
    if(action==='to-lab')renderLab();
    if(action==='to-build')initBuild();
    if(action==='build-reset'){const task=buildTasks[state.buildIndex];state.buildPlaced=[];state.buildPool=shuffled(task.answer);renderBuild()}
    if(action==='build-check')checkBuild();
    if(action==='build-next'){state.buildIndex++;state.buildPlaced=[];state.buildAttempts=0;state.buildPool=shuffled(buildTasks[state.buildIndex].answer);renderBuild()}
    if(action==='to-quiz')startQuiz();
    if(action==='quiz-next')quizNext();
    if(action==='review')startQuiz([...state.missed],true);
    if(action==='restart'){state.score=0;state.visited=new Set(['wind']);state.topic='wind';state.labAnswered=false;intro()}
  });
  document.addEventListener('keydown',e=>{if(state.mode==='quiz'&&state.quizSelected===null&&/^[1-4]$/.test(e.key)){answerQuiz(Number(e.key)-1)}});
  intro();
})();
</script>
</body>
</html>

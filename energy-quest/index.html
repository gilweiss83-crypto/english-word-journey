  soundBtn.addEventListener('click',()=>{state.sound=!state.sound;soundBtn.textContent=state.sound?'♪ צליל: פועל':'♪ צליל: כבוי';soundBtn.setAttribute('aria-pressed',String(state.sound));soundBtn.setAttribute('aria-label',state.sound?'כיבוי צלילים':'הפעלת צלילים');if(state.sound)play(true)});
  function mascot(){return '<div class="art-wrap" aria-hidden="true"><div class="art-orbit"></div><div class="orbit-icon sun">☀️</div><div class="orbit-icon wind">🌬️</div><div class="orbit-icon water">💧</div><div class="orbit-icon bulb">💡</div><div class="mascot"><div class="mascot-top"></div><div class="arm r"></div><div class="arm l"></div><div class="leg r"></div><div class="leg l"></div><div class="mascot-body"></div><div class="eyes"><div class="eye"></div><div class="eye"></div></div><div class="cheeks"><div class="cheek"></div><div class="cheek"></div></div><div class="smile"></div><div class="bolt">ϟ</div></div></div>'}
  function intro(){state.mode='intro';screen.innerHTML='<section class="hero"><div class="hero-copy"><span class="eyebrow">משחק מדעים לכיתה ו׳</span><h1>משימת <em>האנרגיה!</em></h1><p class="lead">עוזרים לטעון את המעבדה: מזהים מקורות אנרגיה, מגלים למה היא הופכת ומשלימים שרשראות. מוכנים?</p><button class="primary" data-action="start">מתחילים לשחק</button><div class="intro-stats"><span><b>3</b> שלבים</span><span><b>16</b> אתגרים</span><span><b>∞</b> אפשר לנסות שוב</span></div></div>'+mascot()+'</section>';}
  function start(list=full,review=false){state.mode='game';state.list=list;state.index=0;state.score=0;state.streak=0;state.missed=[];state.selected=null;state.review=review;renderQuestion()}
  function renderQuestion(){const q=state.list[state.index],round=rounds[q.roundIndex],number=state.index+1,total=state.list.length;let subtitle=q.sub|| (q.type==='source'?'המקור הזה מתחדש בטבע, או שהמלאי שלו מוגבל?':'איזו חוליה חסרה בשרשרת האנרגיה?');const chain=q.chain?'<div class="chain" aria-label="שרשרת אנרגיה">'+q.chain.map((v,i)=>(i?'<span class="chain-arrow" aria-hidden="true">←</span>':'')+'<span class="chain-node '+(v==='?'?'missing':'')+'">'+esc(v==='?'?'מה חסר?':v)+'</span>').join('')+'</div>':'';screen.innerHTML='<section class="game"><div class="hud"><div><div class="stage">'+esc(state.review?'אימון חוזר · טעויות':round.label)+'</div><div class="stage-name">'+esc(round.name)+'</div></div><div class="scoreboard"><span class="pill">⚡ '+state.score+' נקודות</span><span class="pill">'+number+' / '+total+'</span></div></div><div class="progress" role="progressbar" aria-label="התקדמות במשחק" aria-valuemin="0" aria-valuemax="'+total+'" aria-valuenow="'+(number-1)+'"><div style="width:'+Math.round((number-1)/total*100)+'%"></div></div><div class="panel"><div class="question-row"><div class="question-icon" aria-hidden="true">'+q.icon+'</div><div><div class="question-kicker">'+esc(q.type==='source'?'זהו את המקור':q.type==='convert'?'גלו את ההמרה':'חשבו על הרצף')+'</div><h2 class="question-title">'+esc(q.title)+'</h2><p class="question-sub">'+esc(subtitle)+'</p></div></div>'+chain+'<div class="choices" role="group" aria-label="אפשרויות תשובה">'+q.choices.map((choice,i)=>'<button type="button" class="choice" data-choice="'+i+'"><span class="choice-marker">'+(i+1)+'</span><span>'+esc(choice)+'</span></button>').join('')+'</div><div id="feedback" aria-live="polite"></div></div><div class="guide"><span>💡 חושבים, בוחרים ולומדים</span><span>רצף נכון: <b>'+state.streak+'</b></span></div></section>'}
  function answer(index){if(state.selected!==null)return;const q=state.list[state.index],chosen=q.choices[index];if(chosen===undefined)return;state.selected=index;const ok=chosen===q.answer;if(ok){state.score+=10;state.streak++;}else{state.streak=0;state.missed.push(q)}play(ok);document.querySelectorAll('.choice').forEach((button,i)=>{button.disabled=true;if(q.choices[i]===q.answer){button.classList.add('correct');button.querySelector('.choice-marker').textContent='✓'}else if(i===index){button.classList.add('wrong');button.querySelector('.choice-marker').textContent='×'}else button.classList.add('muted')});const label=ok?(state.streak>=3?'איזה רצף! תשובה נכונה ⚡':'בדיוק! תשובה נכונה ⚡'):'כמעט! התשובה היא '+q.answer;document.getElementById('feedback').innerHTML='<div class="feedback '+(ok?'':'bad')+'"><div><h3>'+esc(label)+'</h3><p>'+esc(q.why)+'</p></div><button type="button" class="next" data-action="next">'+(state.index===state.list.length-1?'לתוצאות':'ממשיכים')+'</button></div>';document.querySelector('.progress').setAttribute('aria-valuenow',String(state.index+1));document.querySelector('.progress>div').style.width=Math.round((state.index+1)/state.list.length*100)+'%';document.querySelector('.scoreboard .pill').textContent='⚡ '+state.score+' נקודות';document.querySelector('.guide b').textContent=state.streak;document.querySelector('.next').focus()}
  function next(){if(state.selected===null)return;state.index++;state.selected=null;if(state.index>=state.list.length)results();else renderQuestion()}
  function results(){state.mode='results';if(!state.review&&state.score>best){best=state.score;try{localStorage.setItem('energyQuestBest',String(best))}catch(_){}}const perfect=state.missed.length===0;screen.innerHTML='<section class="game"><div class="panel result"><span class="trophy" aria-hidden="true">'+(perfect?'🏆':'⚡')+'</span><div class="question-kicker">'+(state.review?'סיימתם את האימון':'המעבדה נטענה!')+'</div><h2>'+ (perfect?'כל הכבוד, אלופי האנרגיה!':'עבודה טובה, ממשיכים להשתפר!')+'</h2><p>עניתם נכון על '+(state.list.length-state.missed.length)+' מתוך '+state.list.length+' אתגרים'+(state.review?'.':'.')+'</p><div class="result-number">'+state.score+' <small>נקודות</small></div><div class="result-actions">'+(state.missed.length?'<button type="button" class="secondary" data-action="review">תרגול '+state.missed.length+' טעויות</button>':'')+'<button type="button" class="primary" data-action="restart">משחק חדש</button></div><div class="tips">⚡ טיפ קטן: מקור אנרגיה הוא המקום שממנו מתחילים (למשל שמש או רוח). סוג אנרגיה מתאר איך היא מופיעה (למשל אור או תנועה).'+(best&&!state.review?' השיא שלכם: '+best+' נקודות.':'')+'</div></div></section>'}
  screen.addEventListener('click',e=>{const choice=e.target.closest('[data-choice]');if(choice){answer(Number(choice.dataset.choice));return}const action=e.target.closest('[data-action]')?.dataset.action;if(action==='start'||action==='restart')start();if(action==='next')next();if(action==='review')start([...state.missed],true)});
  document.addEventListener('keydown',e=>{if(state.mode==='game'&&state.selected===null&&/^[1-4]$/.test(e.key)){const n=Number(e.key)-1;if(n<state.list[state.index].choices.length)answer(n)}});
  intro();
})();
</script>
</body>
</html>
